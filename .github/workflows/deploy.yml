name: Deploy Multi-Tool Platform to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Auto-Generate Advanced Multi-Category Tool Platform
        run: |
          mkdir -p src/app
          
          cat << 'EOF' > src/app/layout.js
          import React from 'react';
          export default function RootLayout({ children }) {
            return (
              <html lang="en">
                <body style={{ margin: 0, padding: 0, backgroundColor: '#090d16' }}>
                  {children}
                </body>
              </html>
            );
          }
          EOF
          
          cat << 'EOF' > src/app/page.js
          'use client';
          import React, { useState, useEffect } from 'react';
          import Script from 'next/script';

          export default function WebBrowserEngine() {
            const [adLink, setAdLink] = useState('#');
            const [searchQuery, setSearchQuery] = useState('');
            const [loadingUrl, setLoadingUrl] = useState('');
            const [countdown, setCountdown] = useState(5);
            const [isRouting, setIsRouting] = useState(false);

            useEffect(() => {
              if (typeof window !== 'undefined') {
                setAdLink(process.env.NEXT_PUBLIC_MONETAG_DIRECT_LINK || 'https://monetag.com');
              }
            }, []);

            useEffect(() => {
              let timer;
              if (isRouting && countdown > 0) {
                timer = setTimeout(() => setCountdown(countdown - 1), 1000);
              } else if (isRouting && countdown === 0) {
                setIsRouting(false);
                window.open(loadingUrl, '_blank');
                setCountdown(5);
              }
              return () => clearTimeout(timer);
            }, [isRouting, countdown]);

            const triggerRouting = (targetUrl) => {
              // Fire Monetag Ad immediately in background/new tab
              window.open(adLink, '_blank');
              // Trigger the browser gateway loop on main screen
              setLoadingUrl(targetUrl);
              setIsRouting(true);
            };

            const handleSearchSubmit = (e) => {
              e.preventDefault();
              if (!searchQuery) return;
              // Simulate browser web query resolution
              const simulatedTarget = `https://www.google.com/search?q=${encodeURIComponent(searchQuery)}`;
              triggerRouting(simulatedTarget);
            };

            const popularNodes = [
              { name: 'Google Search Matrix', url: 'https://google.com', desc: 'Global Web Crawler' },
              { name: 'OpenAI ChatGPT Core', url: 'https://chatgpt.com', desc: 'AI Intelligence Node' },
              { name: 'iLovePDF Document Hub', url: 'https://www.ilovepdf.com', desc: 'PDF Multi-Processor' },
              { name: 'Photopea Layer Editor', url: 'https://www.photopea.com', desc: 'Full Graphic Suite' }
            ];

            return (
              <div style={{
                margin: 0, padding: 0, boxSizing: 'border-box',
                fontFamily: 'monospace, sans-serif', backgroundColor: '#090d16',
                color: '#34d399', minHeight: '100vh', display: 'flex', flexDirection: 'column'
              }}>
                <Script src={adLink} strategy="afterInteractive" data-cfasync="false" />

                {/* Simulated Browser Top Navigation Bar */}
                <div style={{ background: '#111827', padding: '0.6rem 1.5rem', display: 'flex', alignItems: 'center', gap: '1rem', borderBottom: '2px solid #1f2937' }}>
                  <div style={{ display: 'flex', gap: '6px' }}>
                    <div style={{ width: '12px', height: '12px', borderRadius: '50%', background: '#ef4444' }}></div>
                    <div style={{ width: '12px', height: '12px', borderRadius: '50%', background: '#f59e0b' }}></div>
                    <div style={{ width: '12px', height: '12px', borderRadius: '50%', background: '#10b981' }}></div>
                  </div>
                  
                  {/* Address Bar Search */}
                  <form onSubmit={handleSearchSubmit} style={{ flexGrow: 1, display: 'flex', background: '#030712', borderRadius: '6px', border: '1px solid #374151', padding: '0.25rem 0.5rem' }}>
                    <span style={{ color: '#4b5563', marginRight: '0.5rem', display: 'flex', alignItems: 'center' }}>🌐</span>
                    <input 
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Search internet database or enter custom query string..."
                      style={{ width: '100%', background: 'transparent', border: 'none', color: '#34d399', outline: 'none', fontSize: '0.9rem' }}
                    />
                  </form>
                  <button onClick={handleSearchSubmit} style={{ background: '#10b981', color: '#000', border: 'none', padding: '0.4rem 1.2rem', borderRadius: '4px', fontWeight: 'bold', cursor: 'pointer' }}>EXECUTE</button>
                </div>

                {/* AD GATEWAY OVERLAY SCREEN */}
                {isRouting && (
                  <div style={{ position: 'fixed', top: 0, left: 0, width: '100vw', height: '100vh', background: 'rgba(3,7,18,0.96)', zIndex: 9999, display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', padding: '2rem', textAlign: 'center' }}>
                    <div style={{ border: '3px solid #3b82f6', borderTop: '3px solid transparent', borderRadius: '50%', width: '50px', height: '50px', animation: 'spin 1s linear infinite', marginBottom: '1.5rem' }}></div>
                    <h2 style={{ color: '#fff', fontSize: '1.8rem', marginBottom: '0.5rem' }}>🔗 SECURE CLOUD GATEWAY ACTIVE</h2>
                    <p style={{ color: '#9ca3af', maxWidth: '500px', fontSize: '0.9rem', marginBottom: '1.5rem' }}>Resolving dynamic node handshake structure. Synchronizing secure target headers...</p>
                    <div style={{ background: '#111827', border: '1px solid #ef4444', color: '#f3f4f6', padding: '1rem 2rem', borderRadius: '8px', fontSize: '1.2rem', fontWeight: 'bold' }}>
                      Ad Authorization Token Bypassing In: <span style={{ color: '#ef4444' }}>{countdown}s</span>
                    </div>
                    <style dangerouslySetInnerHTML={{__html: `@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }`}} />
                  </div>
                )}

                {/* Main Dashboard Workspace */}
                <main style={{ maxWidth: '900px', width: '100%', margin: '0 auto', padding: '4rem 1.5rem', flexGrow: 1, textAlign: 'center' }}>
                  
                  <div style={{ marginBottom: '3rem' }}>
                    <h1 style={{ fontSize: '3.5rem', fontWeight: 'bold', margin: '0 0 0.5rem 0', background: 'linear-gradient(to right, #10b981, #3b82f6)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
                      QUANTUM ENGINE v2.6
                    </h1>
                    <p style={{ color: '#6b7280', fontSize: '0.95rem' }}>Decentralized Web Aggregator Terminal Core</p>
                  </div>

                  {/* Quick-Launch Cluster Nodes */}
                  <h3 style={{ textAlign: 'left', color: '#fff', borderBottom: '1px solid #1f2937', paddingBottom: '0.5rem', marginBottom: '1.5rem', fontSize: '1.1rem' }}>⚡ Fast-Route Local Cluster Core</h3>
                  
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '1rem', textAlign: 'left' }}>
                    {popularNodes.map((node, index) => (
                      <div key={index} style={{ background: '#0f172a', border: '1px solid #1e293b', borderRadius: '6px', padding: '1rem', display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
                        <div>
                          <h4 style={{ color: '#fff', margin: '0 0 0.25rem 0', fontSize: '0.95rem' }}>{node.name}</h4>
                          <p style={{ color: '#6b7280', fontSize: '0.75rem', margin: '0 0 1rem 0' }}>{node.desc}</p>
                        </div>
                        <button 
                          onClick={() => triggerRouting(node.url)}
                          style={{ background: 'transparent', border: '1px solid #34d399', color: '#34d399', padding: '0.4rem', borderRadius: '4px', fontSize: '0.8rem', fontWeight: 'bold', cursor: 'pointer', transition: '0.2s', width: '100%' }}
                        >
                          LAUNCH NODE
                        </button>
                      </div>
                    ))}
                  </div>

                  {/* Instruction Node */}
                  <div style={{ marginTop: '4rem', background: '#111827', borderLeft: '4px solid #3b82f6', padding: '1rem', borderRadius: '4px', textAlign: 'left' }}>
                    <span style={{ color: '#3b82f6', fontWeight: 'bold', fontSize: '0.85rem' }}>[SYSTEM LOG INFO]</span>
                    <p style={{ margin: '0.25rem 0 0 0', color: '#9ca3af', fontSize: '0.8rem', lineHeight: 1.4 }}>
                      Any target query string submitted via the core address network will trigger high-speed structural routing. Secure gateway authentication layers refresh automatically.
                    </p>
                  </div>

                </main>

                <footer style={{ borderTop: '1px solid #1f2937', padding: '1.5rem', textAlign: 'center', color: '#4b5563', fontSize: '0.75rem', background: '#030712' }}>
                  Console Core Framework Routing Matrix Enabled // 2026.
                </footer>
              </div>
            );
          }
          EOF

          cat << 'EOF' > next.config.js
          const nextConfig = {
            output: 'export',
            basePath: '/global-all-in-website-',
            images: { unoptimized: true },
          };
          module.exports = nextConfig;
          EOF

          cat << 'EOF' > package.json
          {
            "name": "quantum-browser-engine",
            "version": "1.0.0",
            "private": true,
            "scripts": { "build": "next build" },
            "dependencies": {
              "next": "^14.2.0",
              "react": "^18.3.0",
              "react-dom": "^18.3.0"
            }
          }
          EOF

      - name: Install Dependencies
        run: npm install

      - name: Build and Static Export Next.js App
        env:
          NEXT_PUBLIC_MONETAG_DIRECT_LINK: ${{ secrets.MONETAG_DIRECT_LINK }}
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
